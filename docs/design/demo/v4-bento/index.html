<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4E5C3">
<!-- 未上线的 MVP：可以拿链接打开，但不该被搜索引擎收录。 -->
<meta name="robots" content="noindex, nofollow">
<title>于你 Yewne · 三数问心</title>
<style>
/* ============================================================
   于你 Yewne — Demo V4「便当 · 治愈」

   坐标：比 V1 克制，比 V3 亲和。
   V3 = 宋体 / 印刷逻辑 / 零圆角 / 冷白
   V4 = 黑体 / 便当格 / 大圆角 / 暖黄        ← 完全相反的一套

   六宫在这里不是记号，是六块颜色 —— 便当格天然就是色块。
   仍然守 §4.6：绿给「赤口」（摩擦），粉给「小吉」（小进展），
   不让颜色变成吉凶编码。

   ---- 色板 v2（2026-08）----
   原底色 #F6DF77 是 oklch(90% 0.127 97)：L=90% 处几乎贴着 sRGB
   色域边界，是这个明度下能取到的最饱和黄——即"太亮眼"的直接成因，
   且比六宫色（C≈0.02–0.045）浓出 3–7 倍，背景比内容还响。
   现在把底色压回和六宫色同一彩度家族（C≈0.05），只留暖色相，
   亮度回落到 92.5%，给白色卡片留出可辨的「浮起」落差。
   全部用 OKLCH 指定，同一色相基准（H≈86–88）串起黄底、正文墨色
   和深色主控件，只有六宫色在 H 上各自散开。
   ============================================================ */

:root{
  /* 暖黄不再是最饱和黄：C 从 0.127 降到 0.048，回到六宫同一彩度家族 */
  --bg:      oklch(92.5% 0.048 88);   /* #F4E5C3 */
  --bg-2:    oklch(87%   0.075 86);   /* #EAD19C 强调用，键盘按压态、高亮描边 */
  --ink:     oklch(29%   0.030 78);   /* #342A1A 暖深褐，不是黑 */
  --ink-2:   oklch(43%   0.025 87);   /* #564F40 */
  --ink-3:   oklch(48%   0.025 88);   /* #635C4E —— 实测复核时发现 .colo/.k 有两处直接坐在生底色上，
                                          52% 那档在那两处只有 4.41:1，压到 48% 稳定在 5.25:1 以上 */

  /* 单一色阶：黄底 → 半透白 → 暖白 → 深墨。四级，同一家族。
     首页只用这四级，不出现任何彩色。 */
  --white:   oklch(98.5% 0.012 88);   /* #FDFAF1 暖白，不是纯白 */
  --veil:    rgba(255,255,255,.52);   /* 半透白：次级格 */
  --veil-2:  rgba(255,255,255,.78);   /* 半透白：格内行 */
  /* 原来是 oklch(22% 0.014 85)：明度贴近纯黑，在柔和暖底上是最硬的图底对比；
     彩度只有 0.014 等于中性黑，根本不属于这套暖色家族 —— 它是「压在」配色上
     而不是「属于」配色。提明度 + 加暖彩度，变成暖深褐。
     30% 是不触发连锁修改的上限：再往上导航未选中项会掉到 4.16:1 不达标。 */
  --dark:    oklch(30%   0.036 74);   /* #392B19 */

  /* 六宫 = 六块便当色。
     规则：有宫位才有颜色，没宫位就没有 ——
     所以这六个色只出现在结果页和心事地图，首页一个都不用。
     否则同一个颜色在一屏里担两份工，看着就是随机的。
     刻意保持反吉凶映射：绿给赤口（摩擦），粉给小吉（小进展）。
     「空亡」改用近乎无彩度的冷灰蓝——六宫里唯一「没有颜色的颜色」，
     恰好呼应它「信息不足、空」的含义，也不会被暖黄底吃掉。 */
  --p-daan:     oklch(90%   0.050 250);  /* #C6E1FF 蓝 */
  --p-liulian:  oklch(89%   0.055 300);  /* #E0D3FB 紫 */
  --p-suxi:     oklch(89%   0.058  53);  /* #FBD1B8 陶橙 */
  --p-chikou:   oklch(89%   0.070 145);  /* #BFE8BF 绿  ← 摩擦 */
  --p-xiaoji:   oklch(88%   0.062 345);  /* #F7C8E1 粉  ← 小进展 */
  --p-kongwang: oklch(90.5% 0.010 245);  /* #DAE0E6 近无彩度冷灰 */

  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --r:  26px;   /* 便当格圆角 */
  --r2: 16px;   /* 格内行圆角 */
  --pad: 16px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
h1,h2,h3{ margin:0; font-size:inherit; font-weight:inherit; line-height:inherit; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
body{
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
  background:#E6E2D8; display:flex; align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh; overflow:hidden;
}

/* ---------- 手机外框 ---------- */
.phone{ position:relative; flex:none; transform-origin:center center; }
.sidebtn{ position:absolute; background:#232325; border-radius:2px; }
.sb-l1{ left:-13px; top:150px; width:3px; height:26px; }
.sb-l2{ left:-13px; top:205px; width:3px; height:52px; }
.sb-l3{ left:-13px; top:266px; width:3px; height:52px; }
.sb-r1{ right:-13px; top:230px; width:3px; height:78px; }
.device{
  width:390px; height:844px; background:var(--bg);
  border-radius:54px; border:11px solid #17171a;
  box-shadow:0 0 0 2px #3c3c40, 0 36px 80px rgba(40,34,18,.3);
  position:relative; overflow:hidden;
}
.island{ position:absolute; top:11px; left:50%; transform:translateX(-50%);
  width:122px; height:34px; background:#000; border-radius:20px; z-index:60; }
.island::after{ content:""; position:absolute; right:13px; top:11.5px; width:11px; height:11px;
  border-radius:50%; background:radial-gradient(circle at 35% 35%,#2b3040,#06080c 70%); }
.homebar{ position:absolute; bottom:9px; left:50%; transform:translateX(-50%);
  width:140px; height:5px; border-radius:3px; background:rgba(52,42,26,.8); z-index:60; pointer-events:none; }

/* ---------- 屏幕 ---------- */
.screen{ position:absolute; inset:0; display:none; flex-direction:column;
  background:var(--bg); overflow:hidden; }
.screen.on{ display:flex; animation:in .3s cubic-bezier(.22,1,.36,1) both; }
@keyframes in{ from{ opacity:0; transform:scale(.985) } to{ opacity:1; transform:none } }

.statusbar{ height:56px; flex:none; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 30px 8px 34px; color:var(--ink); font-size:15.5px; font-weight:600; }
.statusbar .sb-right{ display:flex; align-items:center; gap:6px; }

.body{ flex:1; min-height:0; display:flex; flex-direction:column;
  overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.body::-webkit-scrollbar{ display:none; }

/* ---------- 眉头 ---------- */
.top{ flex:none; display:flex; align-items:center; gap:10px; padding:6px var(--pad) 14px; }
.top .brand{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:var(--ink); }
.top .date{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-2); letter-spacing:.04em; }
.iconbtn{
  width:38px; height:38px; border-radius:50%; border:0; cursor:pointer;
  background:var(--white); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  transition:transform .14s; flex:none;
}
.iconbtn:active{ transform:scale(.9); }
.back{ background:var(--white); }

/* ============================================================
   便当格
   ============================================================ */
.bento{ padding:0 var(--pad) 14px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.cell{
  background:var(--white); border-radius:var(--r); padding:18px;
  border:0; font-family:inherit; text-align:left; color:var(--ink);
  display:flex; flex-direction:column;
  transition:transform .14s cubic-bezier(.22,1,.36,1);
}
button.cell{ cursor:pointer; }
button.cell:active{ transform:scale(.975); }
.cell.wide{ grid-column:1 / -1; }
.cell.dark{ background:var(--dark); color:var(--white); }

.k{ font-size:11.5px; font-weight:600; color:var(--ink-3); letter-spacing:.08em; margin-bottom:10px; }
.cell.dark .k{ color:#A6A08C; }
.t{ font-size:20px; font-weight:800; letter-spacing:-.3px; line-height:1.4; }
.t.lg{ font-size:22px; line-height:1.6; letter-spacing:-.2px; }
.s{ font-size:12.5px; color:var(--ink-2); line-height:1.65; margin-top:6px; }
.cell.dark .s{ color:#B8B2A0; }

/* 格内条目：纯文字 + 小圆点。
   之前是白药丸行叠在半透格上 —— 圆角套圆角，噪点的主要来源。 */
.itm{ display:flex; align-items:center; gap:11px; padding:8px 0;
  font-size:14.5px; font-weight:600; color:var(--ink); }
.itm .bdot{ width:7px; height:7px; border-radius:50%; background:var(--ink); opacity:.3; flex:none; }

/* 六宫记号 —— 概念继承自 V3 的六态系统（一条线上的六种珠子状态），
   但重新用 V4 的语言画：粗描边、可填充，配得上 26px 圆角和 800 字重。
   不带穿线，便当格自己就是容器，不需要再画一条线做归属。 */
.mk{ flex:none; display:inline-flex; color:var(--ink); }

/* 宫位徽记：色块 + 内嵌记号。双通道识别（色 + 形），
   色弱用户也能分清是哪一宫，不必只靠颜色。
   记号用深墨而不是白色：宫位色都在 L≈90%，白记号在这么浅的底上看不见；
   深墨实测 11–12:1。同一个组件用在结果页、首页回顾和心事地图三处。 */
.pdot{
  width:24px; height:24px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.pdot .mk{ color:var(--ink); }
.pdot.lg{ width:38px; height:38px; }
.pdot.sm{ width:21px; height:21px; }

/* Aftercare 顶部的会话签名：三宫连成一行，和结果页/心事地图用同一套记号 */
.sig{ display:flex; align-items:center; gap:9px; padding:0 2px 14px; }
.sig .mk{ color:var(--ink-2); }

/* 首页「上次问的那件事」：回访用户看到的第一块，
   §4.2 只定义了新用户首页，回访首页是我们自己定的。
   放的是这个人自己的东西，不是编辑内容 —— 这是长期陪伴产品
   最该在首屏证明的事。不做打卡、不做连续天数（§1.3 / §4.5 原则 6）。 */
.last-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:14px; }
.last-when{ margin-left:auto; font-size:11.5px; font-weight:600; color:var(--ink-3); }
.last-sig{ display:flex; gap:7px; margin-bottom:14px; }
.last-q{ font-size:19px; font-weight:800; line-height:1.5; letter-spacing:-.3px; color:var(--ink); }
.last-foot{ display:flex; align-items:center; gap:8px; margin-top:14px;
  padding-top:13px; border-top:1px solid rgba(52,42,26,.10); }
.last-names{ font-size:12.5px; font-weight:600; color:var(--ink-3); }
.last-cta{ margin-left:auto; font-size:13px; font-weight:700; color:var(--ink);
  display:flex; align-items:center; gap:5px; }

/* 格子右下的真实数据行：替代原来那三个环 / 三个点。
   装饰读不出含义（设计者本人都认不出「三个相扣的环 = 攒下的主题」），
   换成真实状态 —— 也补上可用性启发式第 1 条：入口要显示里面有没有东西。 */
.cellmeta{ margin-top:14px; font-size:12.5px; font-weight:600; color:var(--ink-3); }
.cell.dark .cellmeta{ color:#A6A08C; }

/* 圆形箭头钮，便当格右下角 */
.go{
  width:42px; height:42px; border-radius:50%; background:var(--dark); color:var(--white);
  display:flex; align-items:center; justify-content:center; flex:none; margin-left:auto;
}
.cell.dark .go{ background:var(--bg); color:var(--ink); }
.cellhead{ display:flex; align-items:flex-start; gap:12px; }
.cellhead .tx{ flex:1; min-width:0; }

/* 六宫色点条 */
.pips{ display:flex; gap:6px; margin-top:14px; }
.pips i{ width:100%; height:7px; border-radius:4px; display:block; }

/* ---------- 药丸按钮 ---------- */
.pill{
  display:flex; align-items:center; justify-content:center; gap:9px;
  width:100%; height:56px; border:0; border-radius:30px; cursor:pointer;
  background:var(--dark); color:var(--white);
  font-family:inherit; font-size:16.5px; font-weight:700; letter-spacing:-.2px;
  transition:transform .14s, opacity .14s;
}
.pill:active{ transform:scale(.97); }
.pill:disabled{ opacity:.34; cursor:not-allowed; }
.pill.ghost{ background:var(--veil-2); color:var(--ink); }
.note{ font-size:11.5px; color:var(--ink-2); text-align:center; margin-top:12px; line-height:1.7; }

/* ---------- 底部导航 ---------- */
.nav{
  flex:none; margin:0 auto 14px; width:calc(100% - 32px);
  background:var(--dark); border-radius:30px; height:62px;
  display:flex; align-items:center; padding:0 8px;
}
.nav button{
  flex:1; height:46px; border:0; background:none; cursor:pointer; border-radius:23px;
  display:flex; align-items:center; justify-content:center; gap:7px;
  color:#9C9682; font-family:inherit; font-size:13px; font-weight:600;
  transition:background .16s, color .16s;
}
.nav button.on{ background:var(--bg); color:var(--ink); }

/* ============================================================
   三数
   ============================================================ */
/* 三个滚轮并排 —— 形状就是「报三个数」这个动作本身，
   而且惯性 / 回弹 / 吸附全部交给浏览器原生 scroll-snap，
   iOS 的滚动物理比手写的好得多。
   输入范围放宽到 1–99（分布偏差 1.063，见 corpus.js 的说明）。 */
.picker{
  position:relative; display:flex; gap:8px; height:220px; margin-top:18px;
  /* 上下淡出用 CSS 遮罩，零成本，比逐项算透明度稳 */
  -webkit-mask-image:linear-gradient(transparent 2%, #000 26%, #000 74%, transparent 98%);
          mask-image:linear-gradient(transparent 2%, #000 26%, #000 74%, transparent 98%);
}
/* 选中带：横贯三列的一条实心墨块，把三个轮子读成一个控件 */
.band{
  position:absolute; left:0; right:0; top:88px; height:44px;
  background:var(--dark); border-radius:14px; pointer-events:none; z-index:0;
}
.col{
  flex:1; position:relative; z-index:1; height:100%;
  overflow-y:scroll; scroll-snap-type:y mandatory;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
  outline:none; border-radius:14px;
}
.col::-webkit-scrollbar{ display:none; }
/* 焦点指示不用描边环：父层的淡出遮罩会把环的上下削掉，只剩两条竖边，
   读起来像乱入的线。改成整列淡底 + 下方序号变实（序号在遮罩之外）。 */
.col:focus-visible{ background:rgba(52,42,26,.07); }
.col .cpad{ height:88px; }          /* (220-44)/2，让首末项也能居中 */
.col .it{
  height:44px; scroll-snap-align:center;
  display:flex; align-items:center; justify-content:center;
  font-size:25px; font-weight:700; color:var(--ink-2);
  font-variant-numeric:tabular-nums; transition:color .16s ease;
  cursor:pointer;   /* 可点选，不是只能拖 */
}
/* 选中项落在墨块上必须反色。只改颜色不改字号 —— 改字号滚动时会抖 */
.col .it.sel{ color:var(--white); font-weight:800; }

.ord{ display:flex; gap:8px; margin-top:10px; }
.ord span{ flex:1; text-align:center; font-size:11.5px; color:var(--ink-3); font-weight:600;
  transition:color .15s; }
.ord span.on{ color:var(--ink); font-weight:800; }

.field{ background:var(--veil-2); border-radius:var(--r2); padding:13px 14px; margin-top:8px; }
.field textarea{
  display:block; width:100%; min-height:56px; border:0; background:none; outline:none; resize:none;
  font-family:inherit; font-size:15px; line-height:1.7; color:var(--ink);
}
.field textarea::placeholder{ color:var(--ink-3); }

.ask{ opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity .45s ease, transform .45s cubic-bezier(.22,1,.36,1); }
.ask.on{ opacity:1; transform:none; pointer-events:auto; }

details.method summary{
  list-style:none; cursor:pointer; font-size:12.5px; font-weight:600;
  color:var(--ink-2); padding:6px 0;
}
details.method summary::-webkit-details-marker{ display:none; }
details.method summary::after{ content:"  ＋"; }
details.method[open] summary::after{ content:"  －"; }

/* ============================================================
   结果
   ============================================================ */
/* 三段合成一张卡，记号成为骨架。
   原来是三张大色卡堆叠 —— 四个问题：大面积浅色像糖果；转折文字漂在
   原底色上没有归属；颜色和宫位名在说同一件事（信息冗余、视觉还吵）；
   记号被塞在角落当脚注。现在颜色只留在徽记上（面积极小但位置醒目），
   转折文字有了容器，三段读起来是「一次占问」而不是「三条独立事实」。 */
.reading{ background:var(--white); border-radius:var(--r); padding:4px 18px 16px; }
.prow{ display:flex; gap:14px; padding:16px 0 2px; }
.ptx{ flex:1; min-width:0; }
.phd{ display:flex; align-items:baseline; gap:8px; margin-bottom:7px; }
.pn{ font-size:15.5px; font-weight:800; color:var(--ink); letter-spacing:-.2px; }
.pk{ font-size:12px; font-weight:600; color:var(--ink-3); }
.pt{ font-size:14px; line-height:1.8; color:#3A362C; }
/* 转折文字缩进对齐正文列，不加竖条（侧边色条是设计禁项，且这里
   本来就不需要——缩进已经说明了它属于上下两段之间） */
.ptr{ font-size:12.5px; line-height:1.72; color:var(--ink-3);
  margin:12px 0 2px 52px; }
.uncert{ background:var(--veil); border-radius:var(--r2); padding:14px 15px;
  font-size:12.5px; line-height:1.75; color:var(--ink-2); }
.colo{ font-family:var(--mono); font-size:10px; color:var(--ink-3); text-align:center;
  margin-top:14px; line-height:1.8; letter-spacing:.04em; }

/* ============================================================
   深聊
   气泡不是通用聊天窗：沿用便当的圆角和暖色，AI 侧是白卡（和内容同族），
   用户侧是深墨（和主操作同族）。两侧形状一致，只有色和对齐分主客。
   ============================================================ */
.aiflag{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px;
  font-size:10.5px; font-weight:700; letter-spacing:.06em;
  color:var(--ink-3); background:var(--veil-2);
  padding:5px 10px; border-radius:20px;
}
.thread{ padding:2px var(--pad) 8px; display:flex; flex-direction:column; gap:10px; }
.bub{
  max-width:84%; padding:14px 16px; border-radius:22px;
  font-size:15px; line-height:1.72; letter-spacing:-.1px;
  animation:rise .3s cubic-bezier(.22,1,.36,1) both;
}
.bub.ai{ background:var(--white); color:var(--ink); border-bottom-left-radius:8px; align-self:flex-start; }
.bub.me{ background:var(--dark); color:var(--white); border-bottom-right-radius:8px; align-self:flex-end; }
.bub .lead{ font-size:11.5px; font-weight:700; letter-spacing:.06em;
  color:var(--ink-3); margin-bottom:7px; display:flex; align-items:center; gap:7px; }
@keyframes rise{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }
/* 正在输入 */
.typing{ display:flex; gap:5px; padding:4px 2px; }
.typing i{ width:7px; height:7px; border-radius:50%; background:var(--ink-3); opacity:.45;
  animation:blink 1.1s infinite; }

<script type="module">
/* 同一个确定性引擎，第三套呈现。 */
import { buildReading, PALACES, METHOD_VERSION, CORPUS_VERSION } from '../v2-product/corpus.js';

/* 输入上界 99：分布偏差仅 1.063，理由见 corpus.js。
   在这里声明是因为下面 LAST_R 等调用要用到（const 不提升）。 */
const MAXN = 99, ITEM = 44;
const S = { nums: [1,1,1], worry: '', reading: null, saved: false };

/* ---------- 后端 ----------
   线上和 /v1 同源，所以不用配跨域。带 ?local=1 时走本地 corpus.js，
   这是给没有后端的场合（本地看稿、断网评审）留的口子，页面上会明确标出来——
   本地引擎和后端 calculator.py 在全部 970,299 种输入上校验过逐点一致，
   但解释是本地固定文案，不是模型现写的，所以必须让人看得见区别。 */
const API = '/v1/reflection/reading';
const LOCAL_ONLY = new URLSearchParams(location.search).has('local');

/* 解释是怎么来的，在 colophon 里如实标注。llm 是正常情况，不加注；
   另外两种都要说明，否则页面在替模型背书它没写过的话（§8.10）。 */
const MODE_NOTE = {
  'fixed-fallback': ' ／ 解释为固定文案（模型未能生成）',
  'local-demo':     ' ／ 本地演示数据',
};

/* 后端返回的 palace 是「留连」这样的中文标签，前端要的是宫位对象 */
const byLabel = Object.fromEntries(PALACES.map(p => [p.label, p]));

/* 把 ReflectionReading 映射成结果页认识的形状。字段对不上时直接抛，
   不做静默兜底——契约变了要立刻看得见，而不是渲染出半张空卡片。 */
function fromApi(j){
  const pos = j.positions.map(p => {
    const palace = byLabel[p.palace];
    if (!palace) throw new Error('未知宫位: ' + p.palace);
    return { name: p.name, palace, interpretation: p.interpretation };
  });
  return {
    numbers: j.numbers,
    summary: j.summary,
    positions: pos,
    transitions: j.transitions.map(t => t.interpretation),
    uncertainty: j.uncertainty,
    controllable: j.controllable_factors,
    micro_action: j.micro_action,
    reflection_question: j.reflection_question,
    scene_label: j.scene_label,
    /* 解释是模型现写还是退回固定文案，如实带到界面上（§10.5、§8.10） */
    mode: j.generation_mode,
    fallback_reason: j.fallback_reason || '',
  };
}

/* 返回 {ok:true, reading} / {ok:false, kind, ...}。不抛异常，
   因为调用点要按 kind 决定显示重试还是场景选择。 */
async function fetchReading(nums, question, scene){
  let res;
  try {
    res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        numbers: nums,
        question: question || '（未填写）',
        ...(scene ? { scene } : {}),   // 只有用户选过才带，否则让后端自己识别
      }),
    });
  } catch (e) {
    return { ok:false, kind:'network', msg:'连不上服务器' };
  }
  if (res.status === 409) {
    const d = await res.json().catch(() => ({}));
    const det = d.detail || d;
    return { ok:false, kind:'scene', labels: det.labels || {} };
  }
  if (res.status === 429) return { ok:false, kind:'rate', msg:'问得有点频繁，等一分钟再试' };
  if (!res.ok)             return { ok:false, kind:'server', msg:'服务器返回 ' + res.status };
  try {
    return { ok:true, reading: fromApi(await res.json()) };
  } catch (e) {
    return { ok:false, kind:'shape', msg:String(e.message || e) };
  }
}
/* hash 直达时铺的「今天这一次」。刻意和 LAST（三天前那次）不同，
   否则首页回顾块和当前会话会撞成同一件事 */
const SAMPLE = '这次面试没消息，我是不是没戏了。';
const worryText = () => S.worry.trim();
const TINT = { daan:'--p-daan', liulian:'--p-liulian', suxi:'--p-suxi',
               chikou:'--p-chikou', xiaoji:'--p-xiaoji', kongwang:'--p-kongwang' };
const tint = id => `var(${TINT[id]})`;

/* ============================================================
   六宫记号 —— 概念借自 V3（demo/v3-yewne/notation.js）的六态系统：
   一条线上六种「珠子」状态，216 种三宫组合就是 216 个可识别的签名。
   这里不是照搬那份细线版：那是印刷体的重量，配不上便当格的
   26px 圆角和 800 字重。改用粗描边、可填充的图形语言重新画，
   去掉穿线——便当格自己就是容器，不需要再画一条线做归属。
   六个状态的含义顺序仍是同一套：落定→回环→前冲→错位→半开→空。 */
const MARK = {
  daan:     '<circle cx="9" cy="9" r="6.3" fill="currentColor"/>',
  liulian:  '<circle cx="9" cy="9" r="6.6" fill="none" stroke="currentColor" stroke-width="2.3"/><circle cx="9" cy="9" r="2.3" fill="currentColor"/>',
  /* 内缩后用圆角连接描边补回外廓：既保持原尺寸，又让尖角变钝 */
  suxi:     '<path d="M6.2 4.3 13.4 9 6.2 13.7Z" fill="currentColor" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>',

/* ---------- 三数：三个滚轮 ---------- */
const picker = document.getElementById('picker');
const askEl = document.getElementById('askBlock'), worryEl = document.getElementById('worry');
worryEl.addEventListener('input', e => { S.worry = e.target.value; });
const cols = [];
S.nums = [1,1,1];

['其一','其二','其三'].forEach((label, ci) => {
  const col = document.createElement('div');
  col.className = 'col'; col.tabIndex = 0;
  col.setAttribute('role','listbox');
  col.setAttribute('aria-label', label + '，1 到 ' + MAXN);
  col.innerHTML = '<div class="cpad"></div>' +
    Array.from({length:MAXN}, (_,i) =>
      `<div class="it" role="option" data-v="${i+1}" aria-selected="${i===0}">${i+1}</div>`).join('') +
    '<div class="cpad"></div>';
  picker.appendChild(col); cols.push(col);

  /* target 独立于滚动位置：平滑滚动是异步的，连按方向键时 scrollTop
     还没到位就被下一次按键读走了（连按 4 次 PageDown 本该 41，会停在 35）。 */
  let raf = null, lastIdx = 0, target = 1, kbUntil = 0;
  const sync = () => {
    const idx = Math.max(0, Math.min(MAXN-1, Math.round(col.scrollTop / ITEM)));
    if (idx === lastIdx) return;
    lastIdx = idx;
    S.nums[ci] = idx + 1;
    if (performance.now() > kbUntil) target = idx + 1;
    paintCol(col, idx);
    if (navigator.vibrate) navigator.vibrate(5);   // Android 有效；iOS 无网页触觉 API
    touched();
  };
  col.addEventListener('scroll', () => {
    cancelAnimationFrame(raf); raf = requestAnimationFrame(sync);
  }, { passive:true });

  col.addEventListener('keydown', e => {
    const d = { ArrowDown:1, ArrowRight:1, ArrowUp:-1, ArrowLeft:-1,
                PageDown:10, PageUp:-10 }[e.key];
    if (d === undefined && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    target = e.key === 'Home' ? 1 : e.key === 'End' ? MAXN : target + d;
    target = Math.max(1, Math.min(MAXN, target));
    kbUntil = performance.now() + 600;
    col.scrollTo({ top:(target-1)*ITEM, behavior:'smooth' });
  });

  /* 点一下数字就把它滚到选中位。
     原来只能拖——但滚轮长得就像一列可点的数字，人的第一反应是点「7」而不是把它
     拖到中间，点了没反应就会以为页面坏了。iOS 原生滚轮同样支持点选，这是符合
     预期的行为，不是额外功能。
     用 scrollTo 而不是直接改 S.nums：让它和拖动走同一条路径（scroll → sync），
     选中态、触觉、touched() 都不用在这里重复一遍。 */
  col.addEventListener('click', e => {
    const it = e.target.closest('.it');
    if (!it) return;
    const idx = [...col.querySelectorAll('.it')].indexOf(it);
    if (idx < 0) return;
    target = idx + 1;
    kbUntil = performance.now() + 600;   // 和键盘同一个护栏，别被异步 scroll 覆盖
    col.scrollTo({ top: idx * ITEM, behavior: 'smooth' });
    /* 点的正好是已选中那个数时，scrollTo 不产生滚动，sync 不会跑，
       心事输入框就永远不出现。这里直接补一次——touched() 是幂等的。 */
    touched();
  });

  const ordSpan = () => document.querySelectorAll('#s-num .ord span')[ci];
  col.addEventListener('focus', ()=>ordSpan().classList.add('on'));
  col.addEventListener('blur',  ()=>ordSpan().classList.remove('on'));

  paintCol(col, 0);
});

function paintCol(col, idx){
  const prev = col.querySelector('.it.sel');
  if (prev){ prev.classList.remove('sel'); prev.setAttribute('aria-selected','false'); }
  const cur = col.querySelectorAll('.it')[idx];
  if (cur){ cur.classList.add('sel'); cur.setAttribute('aria-selected','true'); }
}

/* 心事输入在第一次拨动之后出现：先做完零门槛的动作，再开口写。
   滚轮永远有值，所以不能像旧键盘那样等「三个都选完」。 */
function touched(){
  askEl.classList.add('on');
  document.getElementById('numMeta').textContent = S.nums.join(' · ');
}

function syncNums(animate = true){
  cols.forEach((col, ci) => {
    const v = S.nums[ci] || 1;
    col.scrollTo({ top:(v-1)*ITEM, behavior: animate ? 'smooth' : 'auto' });
    paintCol(col, v-1);
  });
  document.getElementById('numMeta').textContent = S.nums.join(' · ');
}

/* 结果页在等后端时的三种非成功状态。宫位一律先算好并显示——它是纯计算，

function renderPending(kind, msg){

    retry:   { t:'解释没能生成', d:msg + '。宫位是算出来的，不受影响；解释宁可不给，也不编一个。', btn:'重试' },
  }[kind];

    <div class="bento">

    </div>`;
  const rb = document.getElementById('retryRead');

/* 场景识别并列/无命中时，让用户自己选（§4.5 把选择权还给用户） */

async function submitReading(scene){
  if (LOCAL_ONLY){                       // 断网/本地看稿：明确标注，不假装是线上
    S.reading = buildReading(...S.nums, MAXN);
    S.reading.mode = 'local-demo';
    renderReading(); go('read'); return;
  }
  go('read'); renderPending('loading');
  const r = await fetchReading(S.nums, worryText(), scene);
  if (r.ok){ S.reading = r.reading; renderReading(); }
  else if (r.kind === 'scene') renderSceneChoice(r.labels);
  else renderPending('retry', r.msg);
}

document.getElementById('toReading').addEventListener('click', () => submitReading());

/* ============================================================
   深聊
   §6.2 五步微循环：承接原话 → 提炼核心矛盾 → 用不确定语气验证 →
   只问一个问题 → 按用户选择继续。
   §4.5 原则 2：一轮只问一个问题，不做问卷式审讯。
   演示用脚本回复；真实产品这里接生成模型 + 独立校验器（§5.10）。
   ============================================================ */
const MODES = [
  { id:'listen',  t:'只听我说',   d:'先不用分析' },
  { id:'clarify', t:'帮我理清',   d:'哪些是事实' },
  { id:'reframe', t:'换个角度',   d:'还能怎么看' },
  { id:'act',     t:'陪我做一步', d:'从哪里开始' },
];
/* 每种模式的回应都遵守「只问一个问题」，且都落在现实而非卦象上 */
const REPLY = {
  listen:  ['那我先不分析。你慢慢说，我在。',
            '嗯，这种一直悬着的感觉，确实很耗人。还有什么是你一直没跟人说过的？'],
  clarify: ['我们把它拆一下：到目前为止，你**确定发生过**的事有哪些？',
            '那「他不在意了」这一条，是你看到的，还是你推出来的？'],
  reframe: ['有没有一种可能，他的沉默不代表答案，只代表他也还没想清楚？这个说法贴近你的感觉吗？',
            '如果这件事发生在朋友身上，你会怎么劝她？'],
  act:     ['那我们把它缩到最小：今天之内、你一个人就能做完、做了也不会有坏结果的一件事，会是什么？',
            '如果先给自己定一个「等到什么时候」，你觉得那个时间点是哪天？'],
};
const thread = document.getElementById('thread');
const modesEl = document.getElementById('modes');
let chatTurn = 0, chatBusy = false;

function bubble(text, who='ai', lead){
  const d = document.createElement('div');
  d.className = 'bub ' + who;
  d.innerHTML = (lead ? `<span class="lead">${lead}</span>` : '') +
                text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  thread.appendChild(d);
  scrollChat();
  return d;
}
function scrollChat(){
  const b = document.getElementById('chatBody');
  requestAnimationFrame(()=>{ b.scrollTop = b.scrollHeight; });
}
function typing(){
  const d = document.createElement('div');
  d.className = 'bub ai'; d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  thread.appendChild(d); scrollChat(); return d;
}
/* 打字停顿：§10.5 首段回复 p95 < 5s 是工程目标，
   演示里压到 ~600ms，够传达「它在想」又不拖慢体验 */
function aiSay(text, lead){
  chatBusy = true; modesEl.style.visibility = 'hidden';
  const t = typing();
  setTimeout(()=>{
    t.remove(); bubble(text, 'ai', lead);
    chatBusy = false; renderModes();
  }, 600);
}

function renderModes(){
  modesEl.style.visibility = 'visible';
  /* 用过一次就收成小药丸：留着可切换，但不再占地方 */
  modesEl.classList.toggle('slim', chatTurn > 0);
  modesEl.innerHTML = MODES.map(m =>
    `<button data-mode="${m.id}"><span class="mt">${m.t}</span><span class="md">${m.d}</span></button>`).join('');
}

function openChat(){
  thread.innerHTML = ''; chatTurn = 0;
  const p3 = S.reading.positions[2].palace;
  /* 开场必须接住三数结果并只问一个问题 —— §9.6 实验二正是测这一句有没有用。
     范例取自 §4.3 首次体验脚本第 5 步。 */
  bubble(`结果里「当下」落在<b>${p3.label}</b>。${S.reading.summary}`, 'ai',
         `${mark(p3.id,13)} 接着刚才的结果`);
  setTimeout(()=>aiSay(
    worryText()
      ? '先不管准不准。我更想知道：你最难放下的是这件事本身，还是一直没有得到一个明确的答复？'
      : '先不管准不准。你愿意说说，是什么让你现在想问这一件事？'), 450);
}

modesEl.addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if(!b || chatBusy) return;
  const m = MODES.find(x => x.id === b.dataset.mode);
  bubble(m.t, 'me');
  const lines = REPLY[m.id];
  aiSay(lines[Math.min(chatTurn, lines.length - 1)]);
  chatTurn++;
});

function sendSay(){
  const el = document.getElementById('say');
  const v = el.value.trim(); if(!v || chatBusy) return;
  el.value = ''; bubble(v, 'me');
  /* §8.10：用户说「结束 / 不聊了 / 退出」应立即停止追问 */
  if(/结束|不聊|退出|停/.test(v)){
    aiSay('好，那我们就停在这里。我把刚才聊到的整理一下，你看看要不要留下。');
    setTimeout(()=>{ renderAfter(); go('after'); }, 1500);
    return;
  }
  aiSay(chatTurn === 0
    ? '我听到了。如果只能挑一件最让你放不下的，会是哪一件？'
    : '嗯。那这件事里，有没有哪一部分是你现在就能决定的？');
  chatTurn++;
}
document.getElementById('sendBtn').addEventListener('click', sendSay);
document.getElementById('say').addEventListener('keydown', e => { if(e.key === 'Enter') sendSay(); });
document.getElementById('endChat').addEventListener('click', ()=>{ renderAfter(); go('after'); });

/* ---------- Aftercare ---------- */
/* 一张心事卡，不是一摞卡片（§6.4「更像私人心事卡，而不是诊断报告」）。
   §6.4 的 8 个模块不是同一种东西，按「锚点 / 对照 / 行动 / 出处」分区：
   其中「已知事实 ｜ 仍在猜测」是一对对照，左右并排 ——
   便当布局在这里才真正替产品说话（§4.4「区分事实、推测、情绪、需要」）。
   反馈与两个按钮是操作不是内容，放在卡外。 */
function renderAfter(){
  const r = S.reading, p = r.positions.map(x => x.palace);
  document.getElementById('afterBody').innerHTML = `
    <div class="card">
      <div class="cardtop">
        <span class="sig">${signature(p, 17)}</span>
        <span class="cardday">${cn(d.getMonth()+1)}月${cn(d.getDate())}日</span>
      </div>

      <div class="fld">
        <div class="flabel">你真正在问的<button class="edit" data-edit>改</button></div>
        <div class="fbig" data-field>${worryText() || '这次没有写下具体的问题，可以现在补上。'}</div>
      </div>

      <div class="crule"></div>

      <!-- 这一对是整张卡的重点：哪些是真的，哪些是我猜的 -->
      <div class="pair">
        <div class="pcol">
          <div class="flabel">已知事实</div>
          <div class="ptext" data-field>你上一次收到回复是在三天前。<br>你还没有直接问过对方的想法。</div>
        </div>
        <div class="pcol guess">
          <div class="flabel">仍在猜测</div>
          <div class="ptext" data-field>「他是不是已经不在意了」<br><span class="noev">还没有现实证据支持</span></div>
        </div>
      </div>

      <div class="crule"></div>

      <div class="fld">
        <div class="flabel">下一小步 · 24–72 小时内<button class="edit" data-edit>换</button></div>
        <div class="fbig" data-field>${r.micro_action}</div>
      </div>

      <details class="fold">
        <summary>还有 3 项</summary>
        <div class="sub"><div class="sk">我的感受与需要</div>
          <div class="sv" data-field>你在意的不只是结果，还有「不知道要等到什么时候」这件事本身。你需要的可能是一个明确的边界。</div></div>
        <div class="sub"><div class="sk">我能控制的</div><div class="sv">${r.controllable.join('；')}。</div></div>
        <div class="sub"><div class="sk">三数给出的线索</div>
          <div class="sv">${r.positions.map(x=>`${x.name}｜${x.palace.label}　${x.interpretation}`).join('<br><br>')}</div></div>
      </details>
    </div>

    <div class="k" style="margin:20px 0 10px">聊完之后，你觉得</div>
    <div class="chips" id="fb">
      <button class="chip" data-fb>更清楚了很多</button><button class="chip" data-fb>清楚了一点</button>
      <button class="chip" data-fb>差不多</button><button class="chip" data-fb>更乱了</button>
    </div>
    <div style="margin-top:20px;padding-bottom:18px">
      <button class="pill" id="remember">记住这件事
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/></svg>
      </button>
      <button class="pill ghost" data-go="home" style="margin-top:9px">不保存，结束</button>
      <div class="note">Aftercare 默认私密。未保存的内容 24 小时后自动删除。</div>
    </div>`;
}

/* ---------- 心事地图 ----------
   「三天前」那条就是首页「上次问的那件事」同一次会话（共用 LAST），
   两处必须一致，否则 demo 自相矛盾。 */
function renderMap(){
  const themes=[];
  if(S.saved&&S.reading) themes.push({worry:worryText()||'这次没有写下具体的问题',when:'今天 · 刚刚保存',
    palaces:S.reading.positions.map(x=>x.palace),
    lines:[['反复出现的主题','一旦没有回音，就开始预设最坏的结果。']]});
  themes.push({...LAST, palaces:LAST_R.positions.map(x=>x.palace)});
  document.getElementById('mapMeta').textContent=`${themes.length} 个主题`;
  document.getElementById('mapBody').innerHTML=`
    ${themes.map(t=>`
      <div class="theme">
        <div style="display:flex;gap:5px;margin-bottom:11px">
          ${t.palaces.map(p=>`<span class="pdot" style="background:${tint(p.id)}">${mark(p.id,14)}</span>`).join('')}
        </div>
        <div class="tt">${t.worry}</div>
        <div class="tm">${t.topic?t.topic+' · ':''}${t.when}</div>
        ${t.lines.length?`<div class="tl">${t.lines.map(l=>`<div class="li"><b>${l[0]}</b>　${l[1]}</div>`).join('')}</div>`:''}
      </div>`).join('')}
    <div class="ac" style="background:var(--veil)">
      <div class="k" style="margin:0 0 8px">阶段回看</div>
      <div class="sv" style="font-size:13px;line-height:1.75;color:#43402F">还需要一次相关记录。累积三次之后，于你会告诉你：这类情况下，你真正有效的动作通常是什么。</div>
    </div>
    <div style="height:16px"></div>`;
}

/* ---------- 事件 ---------- */
function ensureReading(){
  if(S.reading) return;
  S.nums=[2,5,2];
  if(!S.worry){ S.worry=SAMPLE; worryEl.value=SAMPLE; }
  /* 从 #chat / #after / #map 直接进来时铺的演示会话，和 LAST 同一性质：
     本地引擎出的，解释不是模型写的，所以标成 local-demo，别让 colophon 说谎。 */
  syncNums(false);
  S.reading = buildReading(2,5,2,MAXN);
  S.reading.mode = 'local-demo';
  renderReading();
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-last]')){ openLast(); return; }
  const g=e.target.closest('[data-go]');
  if(g){
    const id=g.dataset.go;
    if(g.hasAttribute('data-seed')&&id!=='home') ensureReading();
    if(id==='chat'){ ensureReading(); openChat(); }
    if(id==='after'){ ensureReading(); renderAfter(); }
    if(id==='map') renderMap();
    if(id==='num'){ S.nums=[1,1,1]; askEl.classList.remove('on'); syncNums(false); }
    go(id); return;
  }
  if(e.target.id==='remember'){ S.saved=true; renderMap(); go('map'); return; }
  const fb=e.target.closest('[data-fb]');
  if(fb){ document.querySelectorAll('[data-fb]').forEach(x=>x.classList.remove('on')); fb.classList.add('on'); return; }
  const ed=e.target.closest('[data-edit]');
  if(ed){
    const v=(ed.closest('.flabel')||ed.closest('.achead')).nextElementSibling;
    v.contentEditable='true'; v.focus();
    const rg=document.createRange(); rg.selectNodeContents(v);
    const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    const o=ed.textContent; ed.textContent='好';
    v.addEventListener('blur',()=>{ v.contentEditable='false'; ed.textContent=o; },{once:true});
  }
});

/* ---------- 启动 / hash 直达 ----------
   同文档导航（只改 hash）不会重载页面，所以必须单独监听 hashchange，
   否则分享出去的 #chat / #map 链接在已打开的页面上点不动。 */
const ROUTES = ['num','read','chat','after','map'];
function openFromHash(){
  const h = location.hash.replace('#','');
  if(!ROUTES.includes(h)){ go('home'); return; }
  if(h !== 'num') ensureReading();
  if(h === 'chat') openChat();
  if(h === 'after') renderAfter();
  if(h === 'map'){ S.saved = true; renderMap(); }
  go(h);
}
syncNums(false); renderHome();
openFromHash();
addEventListener('hashchange', openFromHash);

/* ---------- 桌面自适应 ---------- */
const phone=document.getElementById('phone');
const DW=390+22, DH=844+22;
function fit(){
  if(matchMedia('(max-width:500px)').matches){ phone.style.transform=''; phone.style.margin=''; return; }
  const s=Math.min(1,(innerHeight-24)/DH,(innerWidth-24)/DW);
  phone.style.transform=`scale(${s})`;
  phone.style.margin=`${(s-1)*DH/2}px ${(s-1)*DW/2}px`;
}
addEventListener('resize',fit); fit();
</script>
</body>
</html>
