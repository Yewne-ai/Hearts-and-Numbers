<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4E5C3">
<title>于你 · 滚轮选数原型</title>
<style>
/* ============================================================
   三数输入「滚轮」原型 —— 1–99，三个并排

   相对罗盘的三点优势：
   1. 惯性 / 回弹 / 吸附全部交给浏览器原生 scroll-snap，
      iOS 的滚动物理是调校过的，比手写角速度衰减好得多
   2. 竖向滑动是手机上最熟练的手势
   3. 三个能并排放在一屏 —— 罗盘只能一次转一个，被迫做成三步流程。
      并排之后「报三个数」是一个动作，不是三次确认

   视觉上刻意不模仿 iOS 系统选择器的灰白 + 3D 透视：
   用 V4 自己的暖色板，选中带是一条实心墨块（和主 CTA 同一种语言），
   非选中项只降色不变字号 —— 变字号会在滚动时抖。
   ============================================================ */
:root{
  --bg:      oklch(92.5% 0.048 88);
  --bg-2:    oklch(87%   0.075 86);
  --white:   oklch(98.5% 0.012 88);
  --veil:    rgba(255,255,255,.52);
  --veil-2:  rgba(255,255,255,.78);
  --ink:     oklch(24%   0.015 85);
  --ink-2:   oklch(43%   0.025 87);
  --ink-3:   oklch(48%   0.025 88);
  --dark:    oklch(22%   0.014 85);
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 26px; --r2: 16px; --pad: 16px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
h1,h2{ margin:0; font-size:inherit; font-weight:inherit; }
body{
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
  background:#E6E2D8; display:flex; align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh; overflow:hidden;
}
.phone{ position:relative; flex:none; transform-origin:center; }
.device{
  width:390px; height:844px; background:var(--bg);
  border-radius:54px; border:11px solid #17171a;
  box-shadow:0 0 0 2px #3c3c40, 0 36px 80px rgba(40,34,18,.3);
  position:relative; overflow:hidden; display:flex; flex-direction:column;
}
.island{ position:absolute; top:11px; left:50%; transform:translateX(-50%);
  width:122px; height:34px; background:#000; border-radius:20px; z-index:60; }
.homebar{ position:absolute; bottom:9px; left:50%; transform:translateX(-50%);
  width:140px; height:5px; border-radius:3px; background:rgba(35,32,26,.8); z-index:60; }

.top{ flex:none; padding:62px var(--pad) 0; display:flex; align-items:center; gap:10px; }
.top .ttl{ font-size:15px; font-weight:700; color:var(--ink); }
.top .meta{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-3); }

.body{ flex:1; min-height:0; overflow-y:auto; padding:0 var(--pad); }
.body::-webkit-scrollbar{ display:none; }
.cell{ background:var(--white); border-radius:var(--r); padding:20px 18px; margin-top:14px; }
.t{ font-size:22px; font-weight:800; letter-spacing:-.3px; color:var(--ink); }
.s{ font-size:12.5px; color:var(--ink-2); line-height:1.65; margin-top:6px; }
.k{ font-size:11.5px; font-weight:600; color:var(--ink-3); letter-spacing:.08em; margin-bottom:10px; }

/* ============================================================
   滚轮
   ============================================================ */
.picker{
  position:relative; display:flex; gap:8px;
  height:220px;                     /* 5 格 × 44px */
  margin-top:18px;
  /* 上下淡出：CSS 遮罩，零成本，比逐项算透明度稳 */
  -webkit-mask-image:linear-gradient(transparent 2%, #000 26%, #000 74%, transparent 98%);
          mask-image:linear-gradient(transparent 2%, #000 26%, #000 74%, transparent 98%);
}
/* 选中带：横贯三列的一条实心墨块，把三个轮子读成一个控件 */
.band{
  position:absolute; left:0; right:0; top:88px; height:44px;
  background:var(--dark); border-radius:14px; pointer-events:none; z-index:0;
}
.col{
  flex:1; position:relative; z-index:1; height:100%;
  overflow-y:scroll; scroll-snap-type:y mandatory;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
  outline:none; border-radius:14px;
}
.col::-webkit-scrollbar{ display:none; }
/* 焦点指示不能用描边环：父层的上下淡出遮罩会把环的上下削掉，
   只剩两条竖边，读起来像乱入的线。改成整列淡底 + 下方序号变实，
   序号在遮罩之外，能干净地指出「现在动的是哪一个轮子」。 */
.col:focus-visible{ background:rgba(35,32,26,.07); }
.col .pad{ height:88px; }          /* (220-44)/2，让首末项也能居中 */
.col .it{
  height:44px; scroll-snap-align:center;
  display:flex; align-items:center; justify-content:center;
  font-size:25px; font-weight:700; color:var(--ink-2);
  font-variant-numeric:tabular-nums;
  transition:color .16s ease;
}
/* 选中项落在墨块上，必须反色。只改颜色不改字号 —— 改字号滚动时会抖 */
.col .it.sel{ color:var(--white); font-weight:800; }

.ord{ display:flex; gap:8px; margin-top:10px; }
.ord span{ flex:1; text-align:center; font-size:11.5px; font-weight:600; color:var(--ink-3);
  transition:color .15s, font-weight .15s; }
.ord span.on{ color:var(--ink); font-weight:800; }

/* ---------- 心事输入 ---------- */
.field{ background:var(--veil-2); border-radius:var(--r2); padding:13px 14px; }
.field textarea{
  display:block; width:100%; min-height:56px; border:0; background:none; outline:none;
  resize:none; font-family:inherit; font-size:15px; line-height:1.7; color:var(--ink);
}
.field textarea::placeholder{ color:var(--ink-3); }

.foot{ flex:none; padding:14px var(--pad) 26px; }
.pill{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; height:56px; border:0; border-radius:30px; cursor:pointer;
  background:var(--dark); color:var(--white);
  font-family:inherit; font-size:16.5px; font-weight:700;
  transition:transform .14s, opacity .14s;
}
.pill:active{ transform:scale(.97); }
.pill.ghost{ background:var(--veil-2); color:var(--ink); height:44px; font-size:14px; margin-top:9px; }
.result{ background:var(--white); border-radius:var(--r); padding:16px 18px; }
.result b{ color:var(--ink); font-size:17px; font-weight:800; }
.result .tm{ font-family:var(--mono); font-size:12px; color:var(--ink-3); margin-top:7px; line-height:1.7; }

@media (max-width:500px){
  body{ padding:0; background:var(--bg); overflow:hidden; }
  .phone{ transform:none !important; width:100%; }
  .device{ width:100vw; height:100vh; height:100dvh; border:0; border-radius:0; box-shadow:none; }
  .island,.homebar{ display:none; }
  .top{ padding-top:calc(env(safe-area-inset-top,0px) + 14px); }
  .foot{ padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px); }
}
@media (prefers-reduced-motion:reduce){ .col .it{ transition:none; } }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="device">
    <div class="island"></div><div class="homebar"></div>

    <div class="top">
      <span class="ttl">滚轮选数 · 原型</span>
      <span class="meta" id="timer">0.0s</span>
    </div>

    <div class="body">
      <div class="cell">
        <h1 class="t">想三个数</h1>
        <div class="s">心里想着那件事，不用纠结选哪个。</div>

        <div class="picker" id="picker">
          <div class="band" aria-hidden="true"></div>
        </div>
        <div class="ord"><span>其一</span><span>其二</span><span>其三</span></div>
      </div>

      <div class="cell">
        <div class="k">你想问的是</div>
        <div class="field">
          <textarea id="worry" rows="2" maxlength="200"
            placeholder="比如：我不知道该不该继续等他。"></textarea>
        </div>
      </div>
    </div>

    <div class="foot" id="foot">
      <button class="pill" id="go">看结果
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button class="pill ghost" id="reset">重来</button>
    </div>
  </div>
</div>

<script>
const N = 99, ITEM = 44;
const picker = document.getElementById('picker');
const vals = [1, 1, 1];
let t0 = null, timerId = null;

/* ---------- 建三个轮子 ---------- */
['其一','其二','其三'].forEach((label, ci) => {
  const col = document.createElement('div');
  col.className = 'col';
  col.tabIndex = 0;
  col.setAttribute('role', 'listbox');
  col.setAttribute('aria-label', label + '，1 到 99');
  col.innerHTML = '<div class="pad"></div>' +
    Array.from({length:N}, (_,i) =>
      `<div class="it" role="option" data-v="${i+1}" aria-selected="${i===0}">${i+1}</div>`).join('') +
    '<div class="pad"></div>';
  picker.appendChild(col);

  /* target 独立于滚动位置：平滑滚动是异步的，连按方向键时
     scrollTop 还没到位就被下一次按键读走了（连按 4 次 PageDown
     本该到 41，实际停在 35）。键盘只认 target，不认当前滚动位置。 */
  let raf = null, lastIdx = 0, target = 1, kbUntil = 0;
  const sync = () => {
    const idx = Math.max(0, Math.min(N-1, Math.round(col.scrollTop / ITEM)));
    if (idx === lastIdx) return;
    lastIdx = idx;
    vals[ci] = idx + 1;
    if (performance.now() > kbUntil) target = idx + 1;   // 手动滚动才回写 target
    paint(col, idx);
    // 触觉：Android 有效，iOS Safari 无网页触觉 API，静默失败
    if (navigator.vibrate) navigator.vibrate(5);
    startTimer();
  };
  col.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(sync);
  }, { passive:true });

  /* 键盘通路：滚轮对读屏和键盘同样不友好，必须留 */
  col.addEventListener('keydown', e => {
    const d = { ArrowDown:1, ArrowRight:1, ArrowUp:-1, ArrowLeft:-1,
                PageDown:10, PageUp:-10 }[e.key];
    if (d === undefined && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault(); startTimer();
    target = e.key === 'Home' ? 1 : e.key === 'End' ? N : target + d;
    target = Math.max(1, Math.min(N, target));
    kbUntil = performance.now() + 600;
    col.scrollTo({ top:(target-1)*ITEM, behavior:'smooth' });
  });

  /* 焦点落在哪一列，下方序号就变实 */
  const ordSpan = () => document.querySelectorAll('.ord span')[ci];
  col.addEventListener('focus', ()=>ordSpan().classList.add('on'));
  col.addEventListener('blur',  ()=>ordSpan().classList.remove('on'));

  paint(col, 0);
});

function paint(col, idx){
  const items = col.querySelectorAll('.it');
  const prev = col.querySelector('.it.sel');
  if (prev){ prev.classList.remove('sel'); prev.setAttribute('aria-selected','false'); }
  const cur = items[idx];
  if (cur){ cur.classList.add('sel'); cur.setAttribute('aria-selected','true'); }
}

/* ---------- 计时：验证 §4.6「10 秒内可完成」 ---------- */
function startTimer(){
  if (t0) return;
  t0 = performance.now();
  timerId = setInterval(() => {
    document.getElementById('timer').textContent =
      ((performance.now() - t0) / 1000).toFixed(1) + 's';
  }, 100);
}

document.getElementById('go').addEventListener('click', () => {
  clearInterval(timerId);
  const secs = t0 ? ((performance.now() - t0) / 1000).toFixed(1) : '0.0';
  const w = document.getElementById('worry').value.trim();
  document.getElementById('foot').innerHTML = `
    <div class="result">
      <b>${vals.join(' · ')}</b>
      <div class="tm">三个数共用时 ${secs}s　·　§4.6 要求 10s 内 ${secs <= 10 ? '✓' : '✗'}</div>
      ${w ? `<div class="tm">心事：${w}</div>` : ''}
    </div>
    <button class="pill ghost" onclick="location.reload()" style="margin-top:10px">再试一次</button>`;
});
document.getElementById('reset').addEventListener('click', () => location.reload());

/* 桌面等比缩放 */
const phone = document.getElementById('phone');
const DW = 412, DH = 866;
function fit(){
  if (matchMedia('(max-width:500px)').matches){ phone.style.transform=''; phone.style.margin=''; return; }
  const s = Math.min(1, (innerHeight - 24) / DH, (innerWidth - 24) / DW);
  phone.style.transform = `scale(${s})`;
  phone.style.margin = `${(s-1)*DH/2}px ${(s-1)*DW/2}px`;
}
addEventListener('resize', fit); fit();
</script>
</body>
</html>
